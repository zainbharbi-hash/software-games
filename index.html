<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ألعاب البرمجيات التفاعلية</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f7fb;--card:#fff;--tx:#14233a;--mut:#5b6b82;--pri:#1565c0;--ok:#2e9e5b;--no:#d6453d;--bd:#d9e2ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1724;--card:#182235;--tx:#eaf1fb;--mut:#9fb0c7;--pri:#5aa2f5;--ok:#47c27c;--no:#f0716a;--bd:#2b3a54}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0}h2{margin:4px 0 12px;font-size:1.2rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-size:1rem}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:12px 14px;font-size:1rem}
button.p{background:var(--pri);color:#fff;border-color:var(--pri)}
.g{display:flex;align-items:center;gap:12px;width:100%;text-align:right;margin-bottom:10px;padding:14px}
.g .e{font-size:1.8rem}.g small{display:block;color:var(--mut)}.g .s{margin-inline-start:auto;font-weight:700;color:var(--ok)}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin:8px 0 14px}.bar i{display:block;height:100%;background:var(--pri);width:0;transition:width .3s}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:.95rem}
.big{font-size:3.2rem;text-align:center;margin:6px 0}.q{font-size:1.15rem;font-weight:600;text-align:center;margin:6px 0 16px}
.opts{display:grid;gap:10px}.opts button{padding:14px;font-weight:600}
.opts .ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opts .no{background:var(--no);color:#fff;border-color:var(--no)}
.fb{min-height:48px;margin:12px 0;text-align:center;font-weight:600}
.res{text-align:center}.res .n{font-size:2.6rem;font-weight:800;color:var(--pri)}
.hide{display:none}
.it{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;font-weight:600}.it.drag{opacity:.7;border-color:var(--pri);box-shadow:0 4px 14px rgba(0,0,0,.2)}.it .h{color:var(--mut);font-size:1.3rem}.it .m{margin-inline-start:auto;display:flex;gap:4px}.it .m button{padding:6px 10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;font-weight:600;max-width:100%}.zone{border:2px dashed var(--bd);border-radius:14px;min-height:130px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}.zone.hl{border-color:var(--pri);background:var(--bg)}.zh{color:#fff;border-radius:10px;padding:8px;text-align:center;font-weight:700;margin-bottom:6px;font-size:.95rem}
</style>
</head>
<body>
<main>
<section id="home">
  <h1>🎮 تحدي البرمجيات</h1>
  <p style="color:var(--mut);margin-top:0">العبي بمفردك على جهازك، ثم أظهري نتيجتك لمعلمتك.</p>
  <div class="card"><input id="nm" placeholder="اكتبي اسمك" maxlength="40" autocomplete="off"></div>
  <div id="list"></div>
  <div class="card" style="text-align:center">مجموع نقاطك: <b id="tot">0</b> / <span id="max">0</span></div>
</section>
<section id="play" class="hide">
  <div class="top"><button id="back">→ رجوع</button><span id="sc"></span></div>
  <div class="bar"><i id="pg"></i></div>
  <div class="card">
    <div class="top"><span id="gt"></span><span id="cn"></span></div>
    <div class="big" id="ic"></div>
    <div class="q" id="qt"></div>
    <div class="opts" id="op"></div>
    <div class="fb" id="fb"></div>
    <button class="p hide" id="nx" style="width:100%">التالي ←</button>
  </div>
</section>
<section id="end" class="hide">
  <div class="card res">
    <div class="big" id="em"></div>
    <h2 id="ename"></h2>
    <div class="n" id="es"></div>
    <p id="ems"></p>
    <button class="p" id="again">العب مرة أخرى</button>
    <button id="home2">القائمة الرئيسية</button>
  </div>
</section>
</main>
<script>
const SW="برامج النظام",AP="البرامج التطبيقية";
const G=[
{id:"wh",e:"🧞",t:"من يجيب صح؟",d:"سؤال الجني",o:null,q:[
["🧞","الجني يسأل: من منكم يستطيع إخباري ما هي البرامج التطبيقية؟ اختاري الإجابة الصحيحة:",["🟣 ربما تكون هي تلك البرامج المصممة لأداء وظائف محددة","🔵 أرى أنها البرمجيات المسؤولة عن التعامل مع مكونات الحاسوب","🐰 الصحيح أنها تلك البرمجيات التي تدير مهام ومصادر الحاسوب","🐥 ببساطة هي البرمجيات التي تمثل الواجهة الرسمية للحاسوب"],"البرامج التطبيقية هي البرامج المصممة لأداء وظائف محددة للمستخدم. أما إدارة مكونات الحاسوب ومصادره فمن عمل برامج النظام."]]},
{id:"or",e:"🔀",t:"رتّبي العناصر",d:"بالسحب والتحريك",ord:1,q:[["🔀","رتّبي العناصر الأربعة بالسحب، بدايةً من المستخدم:",["👩‍🎓 المستخدم","📱 البرنامج التطبيقي","🪟 نظام التشغيل","💻 الأجهزة"],"المستخدم يتعامل مع البرنامج التطبيقي، والبرنامج يعمل فوق نظام التشغيل، ونظام التشغيل يدير الأجهزة."]]},
{id:"tf",e:"✅",t:"التقويم النهائي: صح أم خطأ",d:"4 عبارات",o:["صح","خطأ"],q:[
["","برامج تعريف المكونات المادية عبارة عن برامج النظام.",0,"برامج التعريف (Drivers) تُعدّ من برامج النظام."],
["","لا يمكن أن تعمل برامج النظام بشكل مستقل.",1,"برامج النظام تعمل بشكل مستقل، بينما تحتاج البرامج التطبيقية إليها لتعمل."],
["","برامج النظام تُختصر بـ (App).",1,"(App) هو اختصار للبرامج التطبيقية وليس لبرامج النظام."],
["","تطبيقات الهواتف الذكية هي نوع من البرامج التطبيقية.",0,"تطبيقات الهواتف الذكية برامج تطبيقية تؤدي مهمة محددة للمستخدم."]]},
{id:"cl",e:"🗂️",t:"صنّفي البرنامج",d:"اسحبي الأيقونات",dd:1,o:[SW,AP],q:[
["🪟","Windows",0,"ويندوز نظام تشغيل، أي من برامج النظام."],
["📝","Word",1,"ورد برنامج تطبيقي لمعالجة النصوص."],
["👻","Snapchat",1,"سناب شات تطبيق للتواصل الاجتماعي."],
["🗑️","سلة المحذوفات (Recycle Bin)",0,"سلة المحذوفات جزء من نظام التشغيل."],
["🌐","Chrome",1,"كروم متصفح، أي برنامج تطبيقي."],
["🍎","iOS",0,"iOS نظام تشغيل للأجهزة الذكية."]]},
{id:"ex",e:"📱",t:"أمثلة التطبيقات",d:"5 أسئلة",o:null,q:[
["✉️","أي مما يلي من تطبيقات البريد الإلكتروني؟",["Outlook","WhatsApp","Google Maps","أبشر"],"Outlook تطبيق بريد إلكتروني."],
["👥","أي مما يلي من تطبيقات التواصل الاجتماعي؟",["Snapchat","Gmail","Google Maps","أبشر"],"Snapchat تطبيق تواصل اجتماعي."],
["💬","أي مما يلي من تطبيقات الرسائل الفورية؟",["WhatsApp","Outlook","Google Maps","أبشر"],"WhatsApp تطبيق رسائل فورية."],
["🗺️","أي مما يلي من تطبيقات الخرائط؟",["Google Maps","WhatsApp","Snapchat","Outlook"],"Google Maps تطبيق خرائط وملاحة."],
["🏛️","أي مما يلي من التطبيقات الحكومية؟",["أبشر","Instagram","Gmail","Telegram"],"أبشر تطبيق حكومي يقدم خدمات وزارة الداخلية."]]}
];
G.push(G.splice(G.findIndex(x=>x.id==="tf"),1)[0]);
const $=i=>document.getElementById(i);
let S={};try{S=JSON.parse(sessionStorage.getItem("sg")||"{}")}catch(e){}
const save=()=>{try{sessionStorage.setItem("sg",JSON.stringify(S))}catch(e){}};
const show=i=>["home","play","end"].forEach(k=>$(k).classList.toggle("hide",k!==i));
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function home(){
  show("home");let t=0,m=0;$("list").innerHTML="";
  G.forEach(g=>{m+=g.q.length;const s=S[g.id];if(s!=null)t+=s;
    const b=document.createElement("button");b.className="g";
    b.innerHTML=`<span class="e">${g.e}</span><span><b>${g.t}</b><small>${g.d}</small></span><span class="s">${s!=null?s+" / "+g.q.length:""}</span>`;
    b.onclick=()=>start(g);$("list").appendChild(b)});
  $("tot").textContent=t;$("max").textContent=m;
}
let g,i,pts,done;
function start(x){g=x;i=0;pts=0;show("play");$("gt").textContent=g.t;turn()}
function turn(){
  const q=g.q[i];done=false;if(g.dd){ddRender();return}
  $("pg").style.width=(i/g.q.length*100)+"%";
  $("cn").textContent=`${i+1} / ${g.q.length}`;$("sc").textContent="⭐ "+pts;
  $("ic").textContent=q[0]||g.e;$("qt").textContent=q[1];$("fb").textContent="";$("nx").classList.add("hide");
  const op=$("op");op.innerHTML="";op.className="opts";op.style.display="";if(g.ord){ordRender(q);return}
  let list,ans;
  if(g.o){list=g.o.map((t,k)=>[t,k]);ans=q[2]}else{list=sh(q[2].map((t,k)=>[t,k]));ans=0}
  list.forEach(([t,k])=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>pick(b,k===ans);b.dataset.c=k===ans?1:0;op.appendChild(b)});
}
function pick(b,ok){
  if(done)return;done=true;const q=g.q[i];
  [...$("op").children].forEach(x=>{x.disabled=true;if(x.dataset.c==="1")x.classList.add("ok")});
  if(ok){pts++;$("fb").textContent="🎉 إجابة صحيحة! "+q[3]}else{b.classList.add("no");$("fb").textContent="❌ حاولي مرة أخرى في الجولة القادمة. "+q[3]}
  $("sc").textContent="⭐ "+pts;
  $("nx").textContent=i+1<g.q.length?"التالي ←":"عرض النتيجة";$("nx").classList.remove("hide");
}
function ddRender(){
 $("pg").style.width="0";$("cn").textContent="";$("sc").textContent="⭐ 0";$("ic").textContent="🗂️";
 $("qt").textContent="حددي من خلال الصور ما التصنيف المناسب لكل برنامج: اسحبي كل أيقونة إلى مكانها";$("fb").textContent="";$("nx").classList.add("hide");
 const op=$("op");op.className="";op.style.display="block";
 op.innerHTML=`<div class="zone" id="bank" style="min-height:70px;margin-bottom:12px;justify-content:center"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><div class="zh" style="background:#0097a7">${SW}</div><div class="zone" data-k="0"></div></div><div><div class="zh" style="background:#4b3a87">${AP}</div><div class="zone" data-k="1"></div></div></div>`;
 const bank=$("bank"),zs=[...op.querySelectorAll(".zone[data-k]")];
 const btn=document.createElement("button");btn.className="p";btn.textContent="تحقق من الإجابات";btn.style.cssText="width:100%;margin-top:12px";btn.disabled=true;
 const inz=(z,e)=>{const r=z.getBoundingClientRect();return e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom};
 sh(g.q.map((q,k)=>[q,k])).forEach(([q,k])=>{
  const c=document.createElement("div");c.className="chip";c.dataset.a=q[2];c.dataset.k=k;
  c.innerHTML=`<span style="font-size:1.4rem">${q[0]}</span><span>${q[1]}</span>`;
  let ox=0,oy=0,dr=0;
  c.onpointerdown=e=>{if(done)return;const r=c.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top;c.setPointerCapture(e.pointerId);c.style.cssText=`position:fixed;z-index:50;left:${r.left}px;top:${r.top}px;opacity:.85`;dr=1};
  c.onpointermove=e=>{if(!dr)return;c.style.left=(e.clientX-ox)+"px";c.style.top=(e.clientY-oy)+"px";zs.forEach(z=>z.classList.toggle("hl",inz(z,e)))};
  c.onpointerup=c.onpointercancel=e=>{if(!dr)return;dr=0;let t=bank;zs.forEach(z=>{z.classList.remove("hl");if(inz(z,e))t=z});c.style.cssText="";t.appendChild(c);btn.disabled=bank.children.length>0};
  bank.appendChild(c)});
 btn.onclick=()=>{if(done)return;done=true;let n=0,bad=[];
  op.querySelectorAll(".chip").forEach(c=>{const ok=c.parentElement.dataset.k===c.dataset.a;if(ok)n++;else bad.push(g.q[c.dataset.k]);c.style.background=ok?"var(--ok)":"var(--no)";c.style.color="#fff";c.style.cursor="default"});
  pts=n;$("sc").textContent="⭐ "+pts;btn.classList.add("hide");
  $("fb").textContent=bad.length?"صحيح "+n+" من "+g.q.length+". التصحيح: "+bad.map(q=>q[1]+" ← "+(q[2]==0?SW:AP)).join("، ")+".":"🎉 ممتاز! جميع الأيقونات في مكانها الصحيح.";
  $("nx").textContent="عرض النتيجة";$("nx").classList.remove("hide")};
 op.appendChild(btn);
}
function ordRender(q){
 const cor=q[2];let a=sh(cor);while(a.join()===cor.join())a=sh(cor);
 const op=$("op");op.className="";op.style.display="block";
 const ul=document.createElement("div");ul.style.cssText="display:grid;gap:10px";
 a.forEach(t=>{const d=document.createElement("div");d.className="it";d.dataset.t=t;
  d.innerHTML=`<span class="h">☰</span><span>${t}</span><span class="m"><button>▲</button><button>▼</button></span>`;
  const [u,dn]=d.querySelectorAll("button");
  u.onclick=()=>{if(done)return;const p=d.previousElementSibling;if(p)ul.insertBefore(d,p)};
  dn.onclick=()=>{if(done)return;const n=d.nextElementSibling;if(n)ul.insertBefore(n,d)};
  d.onpointerdown=e=>{if(done||e.target.tagName==="BUTTON")return;d.setPointerCapture(e.pointerId);d.classList.add("drag")};
  d.onpointermove=e=>{if(!d.classList.contains("drag"))return;let ref=null;for(const s of [...ul.children]){if(s===d)continue;const r=s.getBoundingClientRect();if(e.clientY<r.top+r.height/2){ref=s;break}}ul.insertBefore(d,ref)};
  d.onpointerup=d.onpointercancel=()=>d.classList.remove("drag");
  ul.appendChild(d)});
 op.appendChild(ul);
 const c=document.createElement("button");c.className="p";c.textContent="تحقق من الترتيب";c.style.cssText="width:100%;margin-top:12px";
 c.onclick=()=>{if(done)return;done=true;let ok=true;[...ul.children].forEach((x,k)=>{const r=x.dataset.t===cor[k];if(!r)ok=false;x.style.background=r?"var(--ok)":"var(--no)";x.style.color="#fff"});
  c.classList.add("hide");pts=ok?1:0;$("sc").textContent="⭐ "+pts;
  $("fb").textContent=(ok?"🎉 ترتيب صحيح! ":"❌ الترتيب الصحيح: "+cor.join(" ← ")+". ")+q[3];
  $("nx").textContent="عرض النتيجة";$("nx").classList.remove("hide")};
 op.appendChild(c);
}
$("nx").onclick=()=>{if(i+1<g.q.length){i++;turn()}else finish()};
function finish(){
  S[g.id]=Math.max(S[g.id]||0,pts);save();show("end");
  const r=pts/g.q.length,n=$("nm").value.trim();
  $("em").textContent=r===1?"🏆":r>=.6?"👏":"💪";
  $("ename").textContent=(n?n+" — ":"")+g.t;
  $("es").textContent=pts+" / "+g.q.length;
  $("ems").textContent=r===1?"ممتاز! إجابات كاملة.":r>=.6?"أحسنتِ! جرّبي مرة أخرى للعلامة الكاملة.":"لا بأس، راجعي الدرس وأعيدي المحاولة.";
}
$("again").onclick=()=>start(g);$("home2").onclick=home;$("back").onclick=home;
home();
</script>
</body>
</html>
